name: app

services:
  api:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: runtime
    image: app:local
    container_name: app-api
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      # Live-editable corpus; the image carries a copy as fallback.
      - ./data:/app/data:ro
      # The ~14 GB embedding model survives container rebuilds here.
      - hf-cache:/home/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - uvicorn
      - src.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hf-cache:
