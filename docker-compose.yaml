services:
  api:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: ai-talent-hub:local
    container_name: ai-talent-hub-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Live reload during development; drop this line for a prod-like run.
      - ./src:/app/src:ro
    command:
      - uvicorn
      - src.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
