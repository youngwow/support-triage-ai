[project]
name = "support-triage-ai"
version = "0.1.0"
description = "Классификация, оценка риска и маршрутизация обращений в поддержку + черновик ответа по базе знаний. Python 3.14, FastAPI, LangGraph, Gemini, LLM, FAISS (RAG)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "einops>=0.8.2",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
    # Giga-Embeddings ships `trust_remote_code` written against transformers 4.x;
    # 5.x removes what it imports. `dtype=` in from_pretrained needs >=4.56.
    "transformers>=4.56,<5",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# `src` is not an installed package, so the repo root must be importable.
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
# `auto` means plain `async def test_...` works without an @pytest.mark.asyncio
# decorator on every test.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Warnings are failures: a DeprecationWarning is a bug report from a dependency.
# The two ignores are import-time Python-3.14 deprecations inside third-party
# code we cannot fix (google-genai touches typing._UnionGenericAlias, langsmith
# calls asyncio.iscoroutinefunction); both fire once on import, nothing warns
# at runtime. Drop them once google-genai/langsmith are 3.14-clean.
filterwarnings = [
    "error",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
markers = [
    "slow: takes noticeable wall-clock time",
    "integration: touches a real external dependency",
]
